name: go-licenses

on:
  push:
    branches:
      - main
    paths:
      - .github/licenses.tmpl
      - .github/workflows/go-licenses.yaml
      - go.mod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-$${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Install go-licenses
        run: |
          go install github.com/google/go-licenses@v1.6.0

      - name: Run go-licenses
        # go.mod's toolchain directive makes `go` switch to a downloaded toolchain, so point
        # GOROOT at it; otherwise go-licenses doesn't recognize standard library packages
        run: GOROOT="$(go env GOROOT)" go-licenses report ./... > docs/pages/licenses/devpod.mdx --template .github/licenses.tmpl --ignore github.com/loft-sh

      - name: Point license links at this repository
        # go-licenses builds the links from the Go module path, which is still github.com/loft-sh/devpod
        run: sed -i 's#https://github.com/loft-sh/devpod/blob/HEAD/#https://github.com/curityio/devpod/blob/HEAD/#g' docs/pages/licenses/devpod.mdx

      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: licenses/devpod
          commit-message: "license(DevPod): Updated OSS licenses"
          title: "license(DevPod): Updated OSS licenses"
          body: Triggered by ${{ github.repository }}@${{ github.sha }}
          signoff: true
          delete-branch: true
