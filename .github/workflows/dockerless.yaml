name: dockerless

# dockerless is the image DevPod builds dev containers with on Kubernetes, without a docker
# daemon (see dockerless/). It is its own Go module: checked on pull requests that change it,
# and published as ghcr.io/curityio/dockerless:<version> when a dockerless-v<version> tag is
# pushed. pkg/devcontainer/single.go pins the version DevPod uses.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dockerless.yaml
      - dockerless/**
  push:
    tags:
      - dockerless-v*
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dockerless

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version-file: dockerless/go.mod
          cache-dependency-path: dockerless/go.sum

      - name: Build, vet and test
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: dockerless

      - name: Check licenses
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          go-licenses check ./... --ignore github.com/loft-sh/devpod

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # dockerless-v0.3.0 is published as 0.3.0. Anything else is only built, for both platforms.
      - name: Get the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/dockerless-v* ]]; then
            echo "version=${GITHUB_REF_NAME#dockerless-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.version.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: dockerless
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.version.outputs.version != '' }}
          tags: ghcr.io/curityio/dockerless:${{ steps.version.outputs.version || 'test' }}
